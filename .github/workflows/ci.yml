name: CI

# Pushes to main run these checks through deploy.yml, which publishes only when they pass.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Playwright's image ships the browsers and their system libraries, so no step depends on
    # the Ubuntu package mirror (its slowness cancelled two deploys). Keep the tag equal to
    # @playwright/test in package.json; the digest pins it like the actions' SHAs.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --user 1001 --ipc=host
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Check Astro and TypeScript
        run: npm run check
      - name: Build static site
        run: npm run build
      - name: Check size budgets (initial JS, explorer chunk, media per visit)
        run: npm run budgets
      - name: Audit dependencies
        run: npm audit --audit-level=high
      # A no-op while the image matches @playwright/test; if they drift, it fetches the
      # browsers from Playwright's CDN (never the apt mirror) or fails loudly.
      - name: Check Playwright browsers
        run: npx playwright install chromium firefox webkit
      - name: Run browser tests (Chromium, Firefox, WebKit + axe)
        run: npm test
      - name: Check Lighthouse budgets (LCP, CLS on throttled mobile)
        run: npm run lighthouse
