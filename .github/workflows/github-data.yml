name: Refresh GitHub data

# Weekly: re-measure each project's last commit and lines of code (scripts/sync-github.mjs)
# and, when they changed, push a branch and open a pull request. Merging it deploys as usual
# (deploy.yml runs the full checks). Pull requests opened with GITHUB_TOKEN do not start other
# workflows, so this job checks the site still builds within budget before pushing.
on:
  schedule:
    - cron: '17 6 * * 1' # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: github-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Re-measure the repositories
        run: npm run sync:github
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Stop when nothing changed
        id: diff
        run: |
          if git diff --quiet -- src/data/github.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The snapshot is up to date." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            { echo '```diff'; git diff -- src/data/github.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check the site with the new data
        if: steps.diff.outputs.changed == 'true'
        run: npm run format:check && npm run check && npm run build && npm run budgets
      - name: Push a branch and open (or update) the pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=data/github-refresh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -am 'data: refresh the GitHub snapshot'
          git push --force origin "$branch"
          if gh pr view "$branch" --json url --jq .url 2>/dev/null; then
            echo "Updated the open pull request." >> "$GITHUB_STEP_SUMMARY"
          elif gh pr create --base main --head "$branch" \
            --title 'Refresh GitHub data' \
            --body 'Weekly refresh of `src/data/github.json` (last commit, lines of code) by `npm run sync:github`. The site was type-checked, built and checked against its size budgets with the new data; merging deploys with the full checks.'; then
            echo "Opened a pull request." >> "$GITHUB_STEP_SUMMARY"
          else
            # Needs "Allow GitHub Actions to create and approve pull requests" in the repository's
            # Actions settings; without it, the branch is ready for a pull request by hand.
            echo "Could not open a pull request; open one from https://github.com/${GITHUB_REPOSITORY}/compare/main...${branch}" >> "$GITHUB_STEP_SUMMARY"
          fi
